[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-github-profile-scraper"
version = "0.1.0"
description = "Python client for GitHub Profile Scraper on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "github", "profile", "scraper"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/github-profile-scraper"
Source = "https://github.com/apivault-labs/github-profile-scraper-python"
Documentation = "https://github.com/apivault-labs/github-profile-scraper-python#readme"

[tool.setuptools.packages.find]
include = ["apivault_github_profile_scraper*"]
